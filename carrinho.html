<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrinho — GTK Elétrica e Info</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="carrinho">

  <header class="site-header"><div id="site-header"></div></header>

  <main>
    <section class="page-hero" style="padding-bottom:24px">
      <div class="container">
        <span class="eyebrow">Carrinho</span>
        <h1>Seus serviços selecionados</h1>
      </div>
    </section>

    <section style="padding-top:0">
      <div class="container checkout-layout">
        <div>
          <div id="cart-list"></div>
          <div class="empty-state hidden" id="cart-empty">
            <div class="icon-box"><span class="material-symbols-outlined">shopping_cart</span></div>
            <h3 style="margin-bottom:6px">Seu carrinho está vazio</h3>
            <p>Adicione serviços no catálogo para agendar um atendimento.</p>
            <a href="catalogo.html" class="btn primary" style="margin-top:16px">Ver catálogo</a>
          </div>
        </div>

        <div class="cart-summary">
          <h3 style="font-size:15px;margin-bottom:14px">Resumo do pedido</h3>
          <div id="cart-summary-body"></div>
          <a href="pagamento.html" class="btn primary block" id="go-checkout" style="margin-top:16px">Ir para agendamento</a>
          <a href="catalogo.html" class="btn ghost block" style="margin-top:8px">Continuar escolhendo serviços</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer"><div id="site-footer"></div></footer>
  <div id="wa-float-root"></div>
  <div id="toast-root"></div>

  <script src="js/config.js"></script>
  <script src="js/darkmode.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/header.js"></script>
  <script src="js/calendario.js"></script>
  <script src="js/pagamento.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Ajuste de prevenção de erro caso não ache o botão de primeira
      const waBtn = document.getElementById("success-wa");
      if (waBtn && typeof gtkWhatsappLink === "function") {
        waBtn.href = gtkWhatsappLink("Olá! Acabei de confirmar um agendamento pelo site da GTK.");
      }
    });
  </script>
</body>
</html>
</body>
</html>
